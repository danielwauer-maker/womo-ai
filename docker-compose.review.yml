services:
  womo-ai:
    build: .
    container_name: womo-ai-review
    restart: unless-stopped
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8092:8000"
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
