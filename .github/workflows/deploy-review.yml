name: Deploy Review

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - "docker-compose.review.yml"
      - "deploy/**"
      - ".github/workflows/deploy-review.yml"
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.HETZNER_HOST != '' && secrets.HETZNER_USER != '' && secrets.HETZNER_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script: |
            set -e
            cd /opt/womo-ai
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            docker compose -f docker-compose.review.yml up -d --build --remove-orphans
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8092/health; then
                exit 0
              fi
              sleep 2
            done
            docker compose -f docker-compose.review.yml logs --tail=120
            exit 1
